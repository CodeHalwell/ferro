[package]
name = "ferro-py"
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/codehalwell/flare"

[lib]
name = "ferro"
crate-type = ["cdylib"]

[dependencies]
ferro-core = { path = "../ferro-core" }
ferro-fastcpu = { path = "../ferro-fastcpu" }
ferro-cuda = { path = "../ferro-cuda" }
cudarc = { version = "0.19.8", default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "cublas",
    "dynamic-loading",
    "cuda-12080",
] }

[dependencies.pyo3]
version = "0.24"
features = ["extension-module", "abi3-py311"]
