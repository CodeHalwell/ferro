[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ferro"
version = "0.0.1"
description = "Python bindings for the ferro Rust tensor + autograd runtime"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
test = ["numpy==2.4.3", "safetensors==0.8.0", "torch==2.13.0", "torch-geometric==2.8.1"]

[tool.maturin]
module-name = "ferro._native"
python-source = "python"
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]
