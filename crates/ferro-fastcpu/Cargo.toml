[package]
name = "ferro-fastcpu"
version.workspace = true
edition.workspace = true
license.workspace = true

# Zero external dependencies, matching ferro-core: blocking + std::thread only.
[dependencies]
ferro-core = { path = "../ferro-core" }

# Examples only (the crate itself stays zero-dep); the gpt2 example needs the
# real GPT-2 BPE tokenizer.
[dev-dependencies]
ferro-tokenizer = { path = "../ferro-tokenizer" }

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "bench_elementwise"
path = "src/bin/bench_elementwise.rs"
