name: Correctness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: correctness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  rust-cpu:
    name: Rust CPU (${{ matrix.crate }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate: [ferro-core, ferro-fastcpu, ferro-tokenizer]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cpu-${{ matrix.crate }}
      # The workspace lockfile is not tracked; do not use --locked here.
      # Keep cargo test's default targets so doctests run as well.
      - run: cargo test -p ${{ matrix.crate }}

  cuda-compile:
    name: CUDA compile only (no GPU or toolkit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cuda-compile
      # cudarc uses dynamic-loading + cuda-12080. No nvcc/driver install.
      # Compile tests/examples too, but never count skipped GPU tests as proof.
      - run: cargo check -p ferro-cuda --all-targets

  python-cpu:
    name: Python CPU correctness (3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            crates/ferro-py/pyproject.toml
            .github/workflows/correctness.yml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/ferro-py
          key: python-3.11
      - name: Install build and reference dependencies
        run: |
          python -m pip install 'maturin>=1.7,<2.0' numpy==2.4.3 safetensors==0.8.0
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Build and install the actual extension
        run: |
          maturin build --manifest-path crates/ferro-py/Cargo.toml --release --locked --out dist
          python -m pip install --no-deps dist/*.whl
          python -c "import ferro, torch; print(ferro.__file__); assert torch.version.cuda is None"
      - name: Binding and DLPack regressions (including Linux leak check)
        run: python examples/py_regression.py
      - name: Inference capture and full-model replay (CPU)
        run: python -m unittest discover -s crates/ferro-py/tests -v
      - name: Compiled DAG and fuse regressions
        run: |
          python crates/ferro-py/examples/py_compiled_fusion_regression.py
          python crates/ferro-py/examples/py_fuse_regression.py
      - name: Operator values and gradients against torch
        run: python examples/ops_vs_torch.py
      - name: Safetensors reference round trips
        run: python examples/safetensors_vs_python.py
      - name: Seeded random-shape ULP parity
        run: python examples/fuzz_vs_torch.py --trials 200 --seed 0
