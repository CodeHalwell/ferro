[workspace]

[package]
name = "ferro-bench"
version = "0.0.1"
edition = "2021"
license = "MIT"

# Standalone benchmark harness (kept out of the main workspace on purpose).
# The binary source lives at ../examples/bench_transformer.rs so both the
# harness and the example stay in one place.

[dependencies]
ferro-core = { path = "../crates/ferro-core" }
ferro-fastcpu = { path = "../crates/ferro-fastcpu" }
ferro-cuda = { path = "../crates/ferro-cuda", optional = true }

[features]
default = []
cuda = ["dep:ferro-cuda"]

[[bin]]
name = "bench_transformer"
path = "../examples/bench_transformer.rs"

[profile.release]
opt-level = 3
lto = "thin"
